<script>

const DEF={fx:"particulas",anim:"giro",shine:true,bg:"",tileBg:"hue",tileColor:"#1c2340",title:"Muro de Auspiciadores",sub:"Elige cómo quieres verlos",accent:"#d9b76a",theme:"auto",tilt:1,speed:2.8,tvSecs:12,tvModes:["presentacion","linea","mosaico","ajedrez","anillo","individual"],mode:"linea",sp:NM.map((n,i)=>({n,t:i<2?"Platino":i<6?"Oro":"Plata",h:HU[i],img:""}))};

if(!C.mig){if(!C.tvModes.includes("presentacion"))C.tvModes.unshift("presentacion");C.mig=1}

function place(){if(!isCar())return;const W=wall.clientWidth,one=mode==="individual",w=tv?(one?Math.min(W*.7,innerHeight*.62):Math.min(W*.3,innerHeight*.5)):(one?Math.min(W*.7,340):Math.min(W*.42,230)),n=L.length;wall.style.setProperty("--w",w+"px");
[...wall.children].forEach((s,i)=>{let d=i-idx;if(d>n/2)d-=n;if(d<-n/2)d+=n;const a=Math.abs(d);s.classList.toggle("act",d===0);
if(one){s.style.transform=`translate(-50%,-50%) translateX(${d*60}%) rotateY(${-d*70}deg) scale(${d?.6:1.12})`;s.style.opacity=a?0:1;s.style.pointerEvents=a?"none":"auto"}
else{s.style.transform=`translate(-50%,-50%) translateX(${d*w*.78}px) translateZ(${-a*140}px) rotateY(${-Math.sign(d)*Math.min(a,1)*48}deg)`;s.style.opacity=a>2?0:1-a*.22;s.style.zIndex=10-a;s.style.pointerEvents=a>2?"none":"auto"}})}
function render(){const T={linea:9,mosaico:12,ajedrez:12,anillo:10}[mode]||0;L=T?expand(T,{mosaico:innerWidth<=700?2:4,ajedrez:3}[mode]||0):C.sp.map((_,i)=>i);const n=L.length;clearTimeout(presT);if(!tv)presI=0;if(C.anim==="azar")document.documentElement.style.setProperty("--an",["in","az","as","ab","af"][Math.random()*5|0]);wall.innerHTML="";wall.className="wall";wall.style.removeProperty("--w");$("pv").classList.toggle("hide",!isCar());$("nx").classList.toggle("hide",!isCar());idx%=Math.max(n,1);
